[project]
name = "qsr"
version = "0.1.0"
description = "Local quantitative strategy research platform (forex/futures, event-driven, multi-timeframe)"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.0",
    "pydantic>=2.6",
    "pyarrow>=15.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10", "import-linter>=2.0", "httpx>=0.27", "reportlab>=4.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = false

# Architecture enforced by tooling, not convention.
[tool.importlinter]
root_package = "qsr"

[[tool.importlinter.contracts]]
name = "Domain core depends on nothing internal"
type = "forbidden"
source_modules = ["qsr.domain"]
forbidden_modules = ["qsr.data", "qsr.indicators", "qsr.engine", "qsr.analytics", "qsr.application", "qsr.api", "qsr.infra"]

[[tool.importlinter.contracts]]
name = "Indicators depend only on the domain"
type = "forbidden"
source_modules = ["qsr.indicators"]
forbidden_modules = ["qsr.data", "qsr.engine", "qsr.analytics", "qsr.application", "qsr.api", "qsr.infra"]

[[tool.importlinter.contracts]]
name = "Engine depends only on domain and indicators"
type = "forbidden"
source_modules = ["qsr.engine"]
forbidden_modules = ["qsr.data", "qsr.analytics", "qsr.application", "qsr.api", "qsr.infra"]

[[tool.importlinter.contracts]]
name = "Analytics depends only on the domain"
type = "forbidden"
source_modules = ["qsr.analytics"]
forbidden_modules = ["qsr.data", "qsr.indicators", "qsr.engine", "qsr.reporting", "qsr.application", "qsr.api", "qsr.infra"]

[[tool.importlinter.contracts]]
name = "Reporting depends only on domain and analytics"
type = "forbidden"
source_modules = ["qsr.reporting"]
forbidden_modules = ["qsr.data", "qsr.indicators", "qsr.engine", "qsr.application", "qsr.api", "qsr.infra"]

[[tool.importlinter.contracts]]
name = "Nothing imports the API layer"
type = "forbidden"
source_modules = ["qsr.domain", "qsr.data", "qsr.indicators", "qsr.engine", "qsr.analytics", "qsr.reporting", "qsr.application"]
forbidden_modules = ["qsr.api"]
